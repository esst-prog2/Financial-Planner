<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Financial Planning MVP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1 data-i18n="pageTitle">Kiadás-áttekintő</h1>
  <label class="upload">
    <span data-i18n="languageLabel">Nyelv</span>
    <select id="language-select">
      <option value="hu">Magyar</option>
      <option value="en">English</option>
    </select>
  </label>
  <label class="upload">
    <span data-i18n="ownerNameLabel">Saját név (a self-transfer felismeréshez, opcionális)</span>
    <input type="text" id="owner-name" data-i18n-placeholder="ownerNamePlaceholder" placeholder="pl. Fikció Hanna">
  </label>
  <label class="upload">
    <span data-i18n="uploadLabel">Excel feltöltése (OTP + Revolut export)</span>
    <input type="file" id="file-input" accept=".xlsx">
  </label>
</header>

<div id="month-bar" hidden>
  <div id="month-select" class="month-tabs"></div>
  <div id="joint-month-select" class="month-tabs" hidden></div>
</div>

<nav id="view-switch" hidden>
  <button type="button" data-view="personal" class="active" data-i18n="navPersonal">Személyes áttekintő</button>
  <button type="button" data-view="joint" data-i18n="navJoint">Közös számla</button>
</nav>

<main id="app" hidden>
  <section id="personal-view">
    <section id="summary" class="card">
      <h2 data-i18n="summaryHeading">Havi összesítő</h2>
      <ul id="summary-text"></ul>
    </section>

    <div id="income-pie-split">
      <div id="income-pie-left">
        <section class="card">
          <h2 data-i18n="incomeHeading">Bevétel forrásonként</h2>
          <p id="income-total" class="hero-number"></p>
          <ul id="income-sources"></ul>
        </section>

        <section class="card">
          <h2 data-i18n="categoryPieHeading">Kategória szerinti bontás</h2>
          <canvas id="category-pie"></canvas>
          <div id="category-transactions"></div>
        </section>
      </div>

      <aside id="deduction-history" class="card">
        <h2 data-i18n="deductionHistoryHeading">Levonások</h2>
        <div id="deduction-history-rows"></div>
      </aside>
    </div>

    <section class="card">
      <h2 data-i18n="monthlyTrendHeading">Havi trend</h2>
      <label for="category-filter" data-i18n="categoryFilterLabel">Kategória szűrő:</label>
      <select id="category-filter">
        <option value="" data-i18n="allCategoriesOption">Összes</option>
      </select>
      <canvas id="monthly-bar"></canvas>
    </section>
  </section>

  <section id="joint-view" hidden>
    <section class="card">
      <h2 data-i18n="jointPieHeading">Közös számla - teljes kiadás kategóriánként</h2>
      <canvas id="joint-category-pie"></canvas>
      <div id="joint-category-transactions"></div>
    </section>

    <section class="card">
      <h2 data-i18n="jointTrendHeading">Közös számla - havi trend</h2>
      <label for="joint-category-filter" data-i18n="categoryFilterLabel">Kategória szűrő:</label>
      <select id="joint-category-filter">
        <option value="" data-i18n="allCategoriesOption">Összes</option>
      </select>
      <canvas id="joint-monthly-bar"></canvas>
    </section>

    <section class="card">
      <h2 data-i18n="contributorsHeading">Közös számlára érkezett</h2>
      <div id="joint-contributors"></div>
    </section>
  </section>
</main>

<div id="delete-bar" hidden>
  <button type="button" id="clear-selection" data-i18n="clearSelectionLabel">Kijelölések visszavonása</button>
  <button type="button" id="allocate-selected" hidden data-i18n="allocateButtonLabel">Levonás...</button>
  <button type="button" id="delete-selected"><span data-i18n="deleteButtonLabel">Törlés</span> (<span id="delete-count">0</span>)</button>
</div>

<div id="allocation-panel" class="card" hidden>
  <h3 data-i18n="allocationHeading">A bevétel felosztása a kijelölt kiadások között</h3>
  <div id="allocation-rows"></div>
  <p id="allocation-remaining"></p>
  <div id="allocation-actions">
    <button type="button" id="allocation-apply" data-i18n="allocationApplyLabel">Alkalmaz</button>
    <button type="button" id="allocation-cancel" data-i18n="allocationCancelLabel">Mégse</button>
  </div>
</div>

<p id="error-message" role="alert" hidden></p>

<!-- SheetJS: .xlsx parsing in the browser. Pulled from SheetJS's own CDN,
     not the npm mirror - npm is stuck on 0.18.5, which has an unpatched
     prototype-pollution/ReDoS advisory; this version has the fix. -->
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<!-- Chart.js: pie/bar charts -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
